<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpSkillr - AI Driven Personalized Learning</title>
    <link rel="stylesheet" href="style.css">

    <script>
        const savedData = JSON.parse(localStorage.getItem('upSkillrData') || '{}');
        if (savedData.theme) {
            document.documentElement.setAttribute('data-theme', savedData.theme);
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <style>
        /* 🔥 IMPROVED UI */

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            overflow: hidden;
        }

        .splash-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
            animation: fadeIn 1.2s ease-in-out;
        }

        .logo-text {
            font-size: 3rem;
            margin: 10px 0;
            letter-spacing: 1px;
        }

        .logo-text span {
            color: #ff9800;
        }

        .tagline {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        /* ✨ Stronger identity line */
        .subtext {
            font-size: 0.95rem;
            opacity: 0.7;
        }

        .logo-icon {
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        .diamond {
            width: 30px;
            height: 30px;
            background: #ff9800;
            transform: rotate(45deg);
            margin: auto;
        }

        .diamond.inner {
            width: 15px;
            height: 15px;
            background: white;
            margin-top: -22px;
        }

        /* 🔥 Loader improved */
        .loader {
            width: 200px;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            margin-top: 30px;
            border-radius: 10px;
            overflow: hidden;
        }

        .loader-bar {
            height: 100%;
            width: 0;
            background: #ff9800;
            animation: load 3s linear forwards;
        }

        /* ✨ Animations */
        @keyframes load {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .fade-out {
            animation: fadeOut 0.8s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(0.95);
            }
        }
    </style>
</head>

<body class="splash-body">

    <div class="splash-container">

        <div class="logo-wrapper">
            <div class="logo-icon">
                <div class="diamond"></div>
                <div class="diamond inner"></div>
            </div>

            <!-- 🔥 Strong First Impression -->
            <h1 class="logo-text">UpSkillr<span>.</span></h1>

            <!-- 🔥 Clear Identity -->
            <p class="tagline">AI Powered Personalized Learning Platform</p>

            <!-- 🔥 Extra clarity (small but powerful) -->
            <p class="subtext">Analyze your skill gaps. Get guided. Grow faster.</p>
        </div>

        <div class="loader">
            <div class="loader-bar"></div>
        </div>

    </div>

    <script src="script.js"></script>

    <script>
        setTimeout(() => {
            document.querySelector('.splash-container').classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 800);
        }, 3000);
    </script>

</body>

</html>
